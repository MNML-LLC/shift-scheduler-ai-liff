name: Health Check

on:
  schedule:
    # 5 回/日: JST 06:00 / 10:00 / 14:00 / 18:00 / 22:00 (UTC 21/01/05/09/13)
    - cron: '0 21,1,5,9,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe backend health
        id: probe
        env:
          HEALTH_URL: ${{ secrets.LIFF_BACKEND_URL }}
        run: |
          set -u
          HEALTH_URL="${HEALTH_URL:-https://shift-scheduler-ai-liff-production.up.railway.app}"
          echo "health_url=$HEALTH_URL" >> "$GITHUB_OUTPUT"

          status='unhealthy'
          http_code='000'
          reason='3回連続で 200/ok を得られず'

          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $HEALTH_URL/"
            http_code=$(curl -sS -m 30 -o body.txt -w '%{http_code}' "$HEALTH_URL/" || echo '000')
            if [ "$http_code" = '200' ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' body.txt; then
              status='healthy'
              reason='OK'
              echo "Attempt $attempt: healthy (HTTP $http_code)"
              break
            fi
            echo "Attempt $attempt: unhealthy (HTTP $http_code)"
            [ "$attempt" -lt 3 ] && sleep 10
          done

          if [ "$http_code" = '000' ]; then
            http_code='timeout / connection failed'
          fi

          checked_at=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M %Z')
          {
            echo "status=$status"
            echo "http_code=$http_code"
            echo "reason=$reason"
            echo "checked_at=$checked_at"
          } >> "$GITHUB_OUTPUT"

          echo "Result: $status (HTTP $http_code) at $checked_at"

      - name: Notify Slack
        if: steps.probe.outputs.status == 'unhealthy'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RAILWAY_LOG_URL: ${{ secrets.RAILWAY_LOG_URL }}
          HEALTH_URL: ${{ steps.probe.outputs.health_url }}
          HTTP_CODE: ${{ steps.probe.outputs.http_code }}
          REASON: ${{ steps.probe.outputs.reason }}
          CHECKED_AT: ${{ steps.probe.outputs.checked_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo '::warning::SLACK_WEBHOOK_URL is not set; skipping Slack notification'
            exit 0
          fi

          text=":rotating_light: LIFF バックエンド ヘルスチェック失敗
          • 検知日時: ${CHECKED_AT}
          • エンドポイント: ${HEALTH_URL}/
          • HTTP ステータス: ${HTTP_CODE}
          • 判定: ${REASON}"
          if [ -n "${RAILWAY_LOG_URL:-}" ]; then
            text="${text}
          • Railway ログ: ${RAILWAY_LOG_URL}"
          fi
          text="${text}
          • Actions Run: ${RUN_URL}"

          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl -sS -m 30 -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Fail job
        if: steps.probe.outputs.status == 'unhealthy'
        run: |
          echo '::error::LIFF backend health check failed'
          exit 1
