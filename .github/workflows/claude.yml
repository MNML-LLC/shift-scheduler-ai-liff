name: Claude Code

# このファイルを各リポの .github/workflows/claude.yml にコピーして使う。
# ロジックは MNML-LLC/.github の claude-reusable.yml で一元管理。

on:
  issues:
    types: [opened]
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude-code:
    # Issue #2606: reusable 側にも @claude ガードはあるが、caller 側でも二重にガード
    # することで、reusable リゾルブ前に skip 判定させ、ワークフロー全体のノイズ
    # （空振り run / failure conclusion 通知）をゼロにする。
    # issues: opened / pull_request: closed はコメント経由ではないので従来通り実行。
    if: |
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
      contains(github.event.comment.body, '@claude')
    uses: MNML-LLC/.github/.github/workflows/claude-reusable.yml@main
    secrets: inherit